  <path d="M660 2146 V2180 H1455 V1172" class="line"/>
  <path d="M660 2146 V2195 H1455 V1126 H1660" class="line"/>

  <text x="1470" y="1060" class="small">落库前建立 task</text>
  <text x="1490" y="1345" class="small">后台真正开始跑生成</text>
  <text x="1238" y="2500" class="small">LLM 正式生成链路</text>
  <text x="682" y="2218" class="small">图片与缓存补齐</text>
</svg>
