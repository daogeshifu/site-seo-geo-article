  <text x="292" y="892" class="small">是</text>
  <path d="M555 915 H1200 V1126 H1250" class="line"/>
  <text x="585" y="892" class="small">否</text>

  <path d="M1455 730 V1080" class="line"/>
  <path d="M1455 1172 V1225" class="line"/>
  <path d="M1455 1311 V1365" class="line"/>
  <path d="M1455 1451 V1510" class="line"/>

  <path d="M1315 1620 H440" class="line"/>
  <text x="875" y="1600" text-anchor="middle" class="small">是</text>
  <path d="M1455 1730 V1780 H1160" class="line"/>
  <text x="1475" y="1760" class="small">否</text>

  <path d="M280 1662 V1765 H520" class="line"/>
  <path d="M380 1865 H280 V2060" class="line"/>
  <text x="305" y="1840" class="small">是</text>
  <path d="M520 1970 V2060 H660" class="line"/>
  <text x="540" y="2010" class="small">否</text>
  <path d="M430 2103 H510" class="line"/>

  <path d="M1160 1866 V1915" class="line"/>
  <path d="M1160 1993 V2040" class="line"/>
  <path d="M1160 2118 V2170" class="line"/>

  <path d="M1290 2270 H1310" class="line"/>
  <text x="1282" y="2245" class="small">是</text>
  <path d="M1030 2270 H830 V2420" class="line"/>
  <text x="930" y="2245" class="small">否</text>

  <path d="M1530 2245 V2270" class="line"/>
  <path d="M1530 2340 V2365" class="line"/>
  <path d="M1530 2435 V2460" class="line"/>
  <path d="M1530 2530 V2555" class="line"/>
  <path d="M1310 2590 H1230 V2459" class="line"/>
  <path d="M1010 2459 H930" class="line"/>
  <path d="M830 2498 H1080 V2535" class="line"/>
  <path d="M1230 2582 H1230 V2574 H1230" class="line"/>

  <path d="M1080 2613 V2640" class="line"/>
  <path d="M1080 2613 V2640 H720 V2235" class="line"/>
  <path d="M720 2313 V2350" class="line"/>
  <path d="M720 2428 V2480 H660 V2146" class="line"/>
