<svg xmlns="http://www.w3.org/2000/svg" width="1900" height="2620" viewBox="0 0 1900 2620">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8f1e8"/>
      <stop offset="100%" stop-color="#edf7f4"/>
    </linearGradient>
    <linearGradient id="box2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fffdfa"/>
      <stop offset="100%" stop-color="#f4fbf8"/>
    </linearGradient>
    <marker id="arrow2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#47655d"/>
    </marker>
    <style>
      .title { font: 700 34px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill: #17322f; }
      .subtitle { font: 500 18px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill: #4b6760; }
      .label { font: 600 18px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill: #173430; }
      .small { font: 500 14px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill: #4b6760; }
      .box { fill: url(#box2); stroke: #6d9287; stroke-width: 2; rx: 18; }
      .decision { fill: #fefaf1; stroke: #7f9485; stroke-width: 2.2; }
      .store { fill: #edf8f3; stroke: #678c81; stroke-width: 2; rx: 22; }
      .line { stroke: #47655d; stroke-width: 3; fill: none; marker-end: url(#arrow2); }
      .note { font: 600 15px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill: #6a5d30; }
    </style>
  </defs>

  <rect width="1900" height="2620" fill="url(#bg2)"/>
  <text x="90" y="80" class="title">文章生成详细流程图</text>
  <text x="90" y="115" class="subtitle">从任务提交到文章返回的完整执行链路</text>

  <rect x="735" y="160" width="430" height="92" class="box"/>
  <text x="950" y="198" text-anchor="middle" class="label">提交文章任务</text>
  <text x="950" y="226" text-anchor="middle" class="small">category / keyword / info / task_context</text>

  <rect x="770" y="300" width="360" height="80" class="box"/>
  <text x="950" y="348" text-anchor="middle" class="label">API 参数校验</text>

  <rect x="730" y="430" width="440" height="90" class="box"/>
  <text x="950" y="470" text-anchor="middle" class="label">TaskService.create_task</text>
  <text x="950" y="497" text-anchor="middle" class="small">标准化参数、provider、word_limit、access_tier</text>

  <polygon points="950,575 1080,685 950,795 820,685" class="decision"/>
  <text x="950" y="680" text-anchor="middle" class="label">是否 force_refresh</text>
  <text x="950" y="705" text-anchor="middle" class="small">决定是否跳过复用检查</text>

  <rect x="270" y="650" width="330" height="80" class="box"/>
  <text x="435" y="698" text-anchor="middle" class="label">查找可复用任务</text>

  <rect x="1290" y="650" width="330" height="80" class="box"/>
  <text x="1455" y="698" text-anchor="middle" class="label">创建新任务</text>

  <polygon points="435,820 555,915 435,1010 315,915" class="decision"/>
  <text x="435" y="908" text-anchor="middle" class="label">命中已完成任务？</text>

  <rect x="120" y="1080" width="300" height="86" class="box"/>
  <text x="270" y="1120" text-anchor="middle" class="label">直接返回历史结果</text>
  <text x="270" y="1147" text-anchor="middle" class="small">无需再创建新 task</text>

  <rect x="1250" y="1080" width="410" height="92" class="box"/>
  <text x="1455" y="1120" text-anchor="middle" class="label">写入 TaskRepository</text>
  <text x="1455" y="1148" text-anchor="middle" class="small">status = queued，生成 cache_key</text>

  <rect x="1250" y="1225" width="410" height="86" class="box"/>
  <text x="1455" y="1275" text-anchor="middle" class="label">线程池异步执行 _run_task</text>

  <rect x="1250" y="1365" width="410" height="86" class="box"/>
  <text x="1455" y="1415" text-anchor="middle" class="label">更新状态为 running</text>

  <polygon points="1455,1510 1595,1620 1455,1730 1315,1620" class="decision"/>
  <text x="1455" y="1614" text-anchor="middle" class="label">命中文章缓存？</text>

  <rect x="120" y="1580" width="320" height="82" class="box"/>
  <text x="280" y="1628" text-anchor="middle" class="label">读取缓存文章</text>

  <polygon points="520,1760 660,1865 520,1970 380,1865" class="decision"/>
  <text x="520" y="1846" text-anchor="middle" class="label">还需要封面图</text>
  <text x="520" y="1871" text-anchor="middle" class="label">或正文图？</text>

  <rect x="130" y="2060" width="300" height="86" class="box"/>
  <text x="280" y="2108" text-anchor="middle" class="label">ensure_images 补图</text>

  <rect x="510" y="2060" width="300" height="86" class="box"/>
  <text x="660" y="2108" text-anchor="middle" class="label">保存结果</text>

  <rect x="980" y="1780" width="360" height="86" class="box"/>
  <text x="1160" y="1828" text-anchor="middle" class="label">WriterService.generate</text>

  <rect x="980" y="1915" width="360" height="78" class="box"/>
  <text x="1160" y="1962" text-anchor="middle" class="label">标准化 task_context</text>

  <rect x="980" y="2040" width="360" height="78" class="box"/>
  <text x="1160" y="2087" text-anchor="middle" class="label">RulebookService.resolve_rules</text>

  <polygon points="1160,2170 1290,2270 1160,2370 1030,2270" class="decision"/>
  <text x="1160" y="2263" text-anchor="middle" class="label">LLM 可用？</text>

  <rect x="1310" y="2175" width="440" height="70" class="box"/>
  <text x="1530" y="2218" text-anchor="middle" class="label">生成策略 Prompt</text>

  <rect x="1310" y="2270" width="440" height="70" class="box"/>
  <text x="1530" y="2313" text-anchor="middle" class="label">LLM 生成 strategy JSON</text>

  <rect x="1310" y="2365" width="440" height="70" class="box"/>
  <text x="1530" y="2408" text-anchor="middle" class="label">规范化 SEO / GEO strategy</text>

  <rect x="1310" y="2460" width="440" height="70" class="box"/>
  <text x="1530" y="2503" text-anchor="middle" class="label">生成 draft Prompt → draft HTML</text>

  <rect x="1310" y="2555" width="440" height="70" class="box"/>
  <text x="1530" y="2598" text-anchor="middle" class="label">生成 polish Prompt → polished HTML</text>

  <rect x="650" y="2420" width="360" height="78" class="box"/>
  <text x="830" y="2467" text-anchor="middle" class="label">生成 mock article</text>

  <rect x="930" y="2420" width="300" height="78" class="box"/>
  <text x="1080" y="2467" text-anchor="middle" class="label">打包 article 对象</text>

  <rect x="930" y="2535" width="300" height="78" class="box"/>
  <text x="1080" y="2582" text-anchor="middle" class="label">ArticleValidator 校验</text>

  <rect x="560" y="2235" width="320" height="78" class="box"/>
  <text x="720" y="2282" text-anchor="middle" class="label">ImageService 生成或注入图片</text>

  <rect x="560" y="2350" width="320" height="78" class="box"/>
  <text x="720" y="2397" text-anchor="middle" class="label">写入 CacheService</text>

  <rect x="1060" y="112" width="520" height="42" fill="none"/>
  <text x="1060" y="145" class="note">左侧是“缓存/复用路径”，右侧是“新生成路径”</text>

  <rect x="600" y="2060" width="0" height="0" fill="none"/>

  <rect x="960" y="151" width="0" height="0" fill="none"/>

  <rect x="1080" y="1450" width="0" height="0" fill="none"/>

  <rect x="650" y="1450" width="0" height="0" fill="none"/>

  <rect x="1330" y="1080" width="0" height="0" fill="none"/>

  <rect x="1330" y="1365" width="0" height="0" fill="none"/>

  <rect x="930" y="1510" width="0" height="0" fill="none"/>

  <rect x="1350" y="1800" width="0" height="0" fill="none"/>

  <rect x="580" y="2470" width="0" height="0" fill="none"/>

  <path d="M950 252 V300" class="line"/>
  <path d="M950 380 V430" class="line"/>
  <path d="M950 520 V575" class="line"/>

  <path d="M820 685 H600" class="line"/>
  <text x="700" y="665" text-anchor="middle" class="small">否</text>
  <path d="M1080 685 H1290" class="line"/>
  <text x="1185" y="665" text-anchor="middle" class="small">是</text>

  <path d="M435 730 V820" class="line"/>
