<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1220" viewBox="0 0 1800 1220">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f7f4ea"/>
      <stop offset="100%" stop-color="#eef6f2"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fffdfa"/>
      <stop offset="100%" stop-color="#f5fbf8"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3f5f5a"/>
    </marker>
    <style>
      .title { font: 700 34px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill: #17322f; }
      .subtitle { font: 500 18px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill: #486660; }
      .section { font: 700 18px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill: #21433e; }
      .label { font: 600 18px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill: #183431; }
      .small { font: 500 15px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill: #4d6963; }
      .box { fill: url(#card); stroke: #6f938b; stroke-width: 2; rx: 20; }
      .soft { fill: #f7fbf8; stroke: #7ea39a; stroke-width: 2; rx: 18; }
      .store { fill: #eff8f4; stroke: #679084; stroke-width: 2; rx: 22; }
      .group { fill: rgba(255,255,255,0.35); stroke: #d6e5de; stroke-width: 2; rx: 28; }
      .line { stroke: #3f5f5a; stroke-width: 3; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1800" height="1220" fill="url(#bg)"/>
  <text x="90" y="80" class="title">项目整体流程图</text>
  <text x="90" y="115" class="subtitle">SEO / GEO Article Writer 的请求入口、核心服务和存储流向</text>

  <rect x="70" y="150" width="1660" height="1010" class="group"/>
  <text x="100" y="185" class="section">整体主链路</text>

  <rect x="120" y="230" width="240" height="86" class="box"/>
  <text x="240" y="268" text-anchor="middle" class="label">用户或 Demo 页面</text>
  <text x="240" y="295" text-anchor="middle" class="small">Web 表单 / API 调用方</text>

  <rect x="430" y="230" width="280" height="86" class="box"/>
  <text x="570" y="268" text-anchor="middle" class="label">认证换 token</text>
  <text x="570" y="295" text-anchor="middle" class="small">access key → bearer token</text>

  <rect x="790" y="230" width="260" height="86" class="box"/>
  <text x="920" y="268" text-anchor="middle" class="label">FastAPI API 路由</text>
  <text x="920" y="295" text-anchor="middle" class="small">/api/token /outline /tasks</text>

  <rect x="1140" y="210" width="250" height="74" class="soft"/>
  <text x="1265" y="255" text-anchor="middle" class="label">POST /api/outline</text>

  <rect x="1140" y="306" width="250" height="74" class="soft"/>
  <text x="1265" y="351" text-anchor="middle" class="label">POST /api/tasks</text>

  <rect x="1440" y="210" width="250" height="74" class="soft"/>
  <text x="1565" y="255" text-anchor="middle" class="label">GET 结果查询</text>

  <rect x="1440" y="306" width="250" height="74" class="soft"/>
  <text x="1565" y="342" text-anchor="middle" class="label">GET 导出文档</text>
  <text x="1565" y="364" text-anchor="middle" class="small">export.docx</text>

  <rect x="170" y="470" width="280" height="90" class="box"/>
  <text x="310" y="510" text-anchor="middle" class="label">OutlineTaskService</text>
  <text x="310" y="537" text-anchor="middle" class="small">大纲任务编排 / 异步执行</text>

  <rect x="510" y="470" width="280" height="90" class="box"/>
  <text x="650" y="510" text-anchor="middle" class="label">TaskService</text>
  <text x="650" y="537" text-anchor="middle" class="small">文章任务编排 / 缓存复用</text>

  <rect x="850" y="470" width="260" height="90" class="box"/>
  <text x="980" y="510" text-anchor="middle" class="label">OutlineService</text>
  <text x="980" y="537" text-anchor="middle" class="small">生成大纲结构</text>

  <rect x="1170" y="470" width="280" height="90" class="box"/>
  <text x="1310" y="510" text-anchor="middle" class="label">WriterService</text>
  <text x="1310" y="537" text-anchor="middle" class="small">策略 / 草稿 / 润色 / 配图</text>

  <rect x="1510" y="470" width="200" height="90" class="box"/>
  <text x="1610" y="510" text-anchor="middle" class="label">DocExportService</text>
  <text x="1610" y="537" text-anchor="middle" class="small">导出 DOCX</text>

  <rect x="180" y="700" width="240" height="82" class="soft"/>
  <text x="300" y="738" text-anchor="middle" class="label">RulebookService</text>
  <text x="300" y="764" text-anchor="middle" class="small">规则与上下文</text>

  <rect x="500" y="700" width="240" height="82" class="soft"/>
  <text x="620" y="738" text-anchor="middle" class="label">LLMClient</text>
  <text x="620" y="764" text-anchor="middle" class="small">策略 / 文本生成</text>

  <rect x="820" y="700" width="240" height="82" class="soft"/>
  <text x="940" y="738" text-anchor="middle" class="label">ArticleValidator</text>
  <text x="940" y="764" text-anchor="middle" class="small">结构与输出修正</text>

  <rect x="1140" y="700" width="240" height="82" class="soft"/>
  <text x="1260" y="738" text-anchor="middle" class="label">ImageService</text>
  <text x="1260" y="764" text-anchor="middle" class="small">封面图 / 正文图</text>

  <rect x="1460" y="700" width="210" height="82" class="soft"/>
  <text x="1565" y="738" text-anchor="middle" class="label">CacheService</text>
  <text x="1565" y="764" text-anchor="middle" class="small">文章缓存</text>

  <rect x="250" y="930" width="330" height="94" class="store"/>
  <text x="415" y="970" text-anchor="middle" class="label">TaskRepository</text>
  <text x="415" y="997" text-anchor="middle" class="small">任务创建、状态更新、结果保存</text>

  <rect x="760" y="930" width="330" height="94" class="store"/>
  <text x="925" y="970" text-anchor="middle" class="label">MySQL / Memory Repository</text>
  <text x="925" y="997" text-anchor="middle" class="small">article_tasks / article_task_results</text>

  <rect x="1260" y="930" width="330" height="94" class="store"/>
  <text x="1425" y="970" text-anchor="middle" class="label">本地 Cache / OSS</text>
  <text x="1425" y="997" text-anchor="middle" class="small">缓存文件、图片资源、外部对象存储</text>

  <path d="M360 273 H430" class="line"/>
  <path d="M710 273 H790" class="line"/>
  <path d="M1050 248 H1140" class="line"/>
  <path d="M1050 338 H1140" class="line"/>
  <path d="M1390 247 H1440" class="line"/>
  <path d="M1390 343 H1440" class="line"/>

  <path d="M1265 284 V420 H310 V470" class="line"/>
  <path d="M1265 380 V430 H650 V470" class="line"/>
  <path d="M1565 380 V430 H1610 V470" class="line"/>

  <path d="M450 515 H510" class="line"/>
  <path d="M790 515 H850" class="line"/>
  <path d="M1110 515 H1170" class="line"/>

  <path d="M980 560 V650 H300 V700" class="line"/>
  <path d="M980 560 V650 H620 V700" class="line"/>

  <path d="M1310 560 V650 H300 V700" class="line"/>
  <path d="M1310 560 V650 H620 V700" class="line"/>
  <path d="M1310 560 V650 H940 V700" class="line"/>
  <path d="M1310 560 V650 H1260 V700" class="line"/>
  <path d="M650 560 V650 H1565 V700" class="line"/>

  <path d="M310 560 V880 H415 V930" class="line"/>
  <path d="M650 560 V880 H415 V930" class="line"/>
  <path d="M415 1024 H760" class="line"/>
  <path d="M1565 782 V880 H1425 V930" class="line"/>
  <path d="M1260 782 V880 H1425 V930" class="line"/>

  <text x="90" y="1180" class="small">说明：图中将图片上传、缓存落盘与任务结果存储合并为资源层，便于汇报展示。</text>
</svg>
